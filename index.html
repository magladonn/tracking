<style>

.stepper .val{min-width:74px;text-align:center;font:700 20px var(--display);font-variant-numeric:tabular-nums}
.stepper .val small{font:400 11px var(--body);color:var(--muted);display:block}
.amount{font:700 40px/1 var(--display);font-variant-numeric:tabular-nums;margin:2px 0 12px}
.amount small{font-size:16px;color:var(--muted);font-weight:600}
.seg{display:inline-flex;background:var(--tint);padding:3px;border-radius:10px;gap:2px;margin-bottom:12px}
.seg button{border:0;background:transparent;padding:8px 16px;border-radius:8px;font-weight:600;color:var(--muted);min-height:38px}
.seg button[aria-pressed=true]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgb(0 0 0/.12)}
.list{display:grid;gap:0}
.li{display:grid;grid-template-columns:1fr auto auto;gap:10px;align-items:center;padding:9px 0;border-top:1px solid var(--line);font-size:14px}
.li:first-child{border-top:0}
.li .m{color:var(--muted);font-size:12px}
.li .x{border:0;background:transparent;color:var(--muted);width:36px;height:36px;border-radius:8px;font-size:18px}
.li .x:hover{background:var(--tint)}
.amt{font-weight:600;font-variant-numeric:tabular-nums}
.tag{font-size:11px;background:color-mix(in srgb,var(--money) 18%,var(--surface));color:var(--money);padding:1px 7px;border-radius:99px;margin-left:6px}
svg text{fill:var(--muted);font-family:var(--body);font-size:11px}
.empty{color:var(--muted);font-size:14px;padding:6px 0}
.banner{grid-column:1/-1;background:var(--surface);border:1px dashed var(--line2);border-radius:14px;padding:14px 18px;display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
footer{margin-top:26px;display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;display:flex;gap:14px;align-items:center;z-index:9;font-size:14px}
.toast button{background:none;border:0;color:inherit;text-decoration:underline;font-weight:600}
.cd{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:520px){.two{grid-template-columns:1fr}.br{grid-template-columns:minmax(80px,38%) 1fr auto}}
@media (prefers-reduced-motion:no-preference){.fill,.col i{transition:height .25s,width .25s}}
</style>

<div class="wrap">
  <header>
    <h1>Gym Money Study</h1>
    <nav class="tabs" role="tablist" id="tabs"></nav>
    <span class="sync" id="sync" aria-live="polite"></span>
  </header>
  <main id="app"></main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
(function(){
"use strict";
/* ---------- constants ---------- */
const START="2026-10-05", REV="2027-01-18", EXAM="2027-01-25";
const MUSCLES=[["chest","Chest","d1"],["fdelt","Front delts","d1"],["sdelt","Side delts","d1"],["bi","Biceps","d1"],
 ["back","Lats / upper back","d2"],["rdelt","Rear delts","d2"],["tri","Triceps","d2"],
 ["ham","Hamstrings","legs"],["quad","Quads","legs"],["calf","Calves","legs"]];
const MN=Object.fromEntries(MUSCLES.map(m=>[m[0],m[1]]));
const TYPES=[["d1","Day 1","Chest · delts · biceps"],["d2","Day 2","Back · rear delts · triceps"],["legs","Legs","Hamstrings · quads · calves"],["rest","Rest",""]];
const TPL={d1:["chest","fdelt","sdelt","bi"],d2:["back","rdelt","tri"],legs:["ham","quad","calf"],rest:[]};
const TL={d1:"Day 1",d2:"Day 2",legs:"Legs",rest:"Rest"};
const EX=[["Bench press","chest"],["Incline DB press","chest"],["Shoulder press","fdelt"],["Lateral raise","sdelt"],["Biceps curl","bi"],
 ["Lat pulldown","back"],["Barbell row","back"],["Rear delt fly","rdelt"],["Triceps pushdown","tri"],["Romanian deadlift","ham"],
 ["Leg curl","ham"],["Squat","quad"],["Leg press","quad"],["Calf raise","calf"]];
const EXM=Object.fromEntries(EX);
const CATS=["Food","Transport","Gym & supplements","Phone & internet","Study","Going out","Clothes","Family","Other"];
const BUDGET0={"Food":800,"Transport":300,"Gym & supplements":500,"Phone & internet":100,"Study":200,"Going out":300,"Clothes":200,"Family":300,"Other":200};
const MODS=[["bda","Business Data Analytics & Decision Making","Data Analytics",45],["fin","Foundations of Finance","Finance",39],
 ["mkt","Introduction to Marketing & BI","Marketing & BI",45],["ob","Organizational Behavior & Leadership","Org. Behavior",48],
 ["sm","Strategic Management Foundations","Strategy",18],["lia","Lead in Action 1","Lead in Action",48],
 ["lang","Languages (French/English)","Languages",48],["mp","Management Projet","Mgmt Projet",24]];
const MOD=Object.fromEntries(MODS.map(m=>[m[0],m]));
const GYM_TARGET=6, SET_MIN=10, SET_MAX=20;

/* ---------- date helpers ---------- */
const pad=n=>String(n).padStart(2,"0");
const fmt=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const parse=s=>{const a=s.split("-").map(Number);return new Date(a[0],a[1]-1,a[2])};
const add=(s,n)=>{const d=parse(s);d.setDate(d.getDate()+n);return fmt(d)};
const dow=s=>(parse(s).getDay()+6)%7;
const monday=s=>add(s,-dow(s));
const T=()=>fmt(new Date());
const diff=(a,b)=>Math.round((parse(a)-parse(b))/864e5);
const MON=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const DAY=["Mon","Tue","Wed","Thu","Fri","Sat","Sun"];
const dlabel=s=>{const d=parse(s);return DAY[dow(s)]+" "+d.getDate()+" "+MON[d.getMonth()]};
const short=s=>{const d=parse(s);return d.getDate()+" "+MON[d.getMonth()]};
const monthOf=s=>s.slice(0,7);
const addMonth=(m,n)=>{const a=m.split("-").map(Number);const d=new Date(a[0],a[1]-1+n,1);return d.getFullYear()+"-"+pad(d.getMonth()+1)};
const mlabel=m=>{const a=m.split("-").map(Number);return MON[a[1]-1]+" "+a[0]};
const uid=()=>Math.random().toString(36).slice(2,9);
const r1=n=>Math.round(n*10)/10;
const nf=n=>Math.round(n).toLocaleString("en-US");
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

/* ---------- state ---------- */
const blank=()=>({v:1,t:0,gym:{days:{}},lifts:[],body:[],tx:[],budgets:Object.assign({},BUDGET0),study:[],goal:15});
let S=blank();
const norm=o=>Object.assign(blank(),o||{},{});
const hasData=()=>Object.keys(S.gym.days).length+S.lifts.length+S.body.length+S.tx.length+S.study.length>0;
const U={tab:"gym",gd:T(),gview:28,md:T(),mm:monthOf(T()),kind:"e",amt:[],cat:"Food",imp:false,
  sd:T(),sm:"bda",hrs:[],ex:"Bench press",sets:3,reps:8,kg:20,bw:null};
try{const t=localStorage.getItem("gms-tab");if(t)U.tab=t}catch(e){}

/* ---------- persistence ---------- */
let dbRef=null,saving=false,dirty=false,lastJson="",timer=null;
const sync=t=>{const e=document.getElementById("sync");if(e)e.textContent=t};
function cacheLocal(){try{localStorage.setItem("gms-state",JSON.stringify(S))}catch(e){}}
function loadLocal(){try{const j=localStorage.getItem("gms-state");if(j)S=norm(JSON.parse(j))}catch(e){}}
async function persist(){
  cacheLocal();
  if(!dbRef){sync("Saved on this device");return}
  if(saving){dirty=true;return}
  saving=true;sync("Saving…");
  try{do{dirty=false;const json=JSON.stringify(S);lastJson=json;await dbRef.set({json:json,t:S.t})}while(dirty);sync("Saved")}
  catch(e){sync("Saved on this device only")}
  finally{saving=false}
}
function commit(){S.t=Date.now();render();clearTimeout(timer);timer=setTimeout(persist,300)}
async function initDb(){
  try{
    if(!window.claude||!window.claude.use)return;
    const db=await window.claude.use("db");if(!db)return;
    dbRef=db.doc("app/state");
    dbRef.onSnapshot(function(snap){
      if(!snap.exists){if(hasData())persist();else sync("Saved");return}
      const d=snap.data();if(!d||!d.json||d.json===lastJson)return;
      let inc;try{inc=JSON.parse(d.json)}catch(e){return}
      if((inc.t||0)>(S.t||0)||!hasData()){S=norm(inc);lastJson=d.json;cacheLocal();render();sync("Saved")}
      else if((inc.t||0)<(S.t||0))persist();
    },function(){sync("Saved on this device only")});
  }catch(e){sync("Saved on this device")}
}

/* ---------- gym calc ---------- */
const sess=d=>{const x=S.gym.days[d];return !!(x&&x.t&&x.t!=="rest")};
function gymStats(){
  const t=T(), days=Object.keys(S.gym.days).filter(sess).sort();
  let cur=0,best=0,rest=0;
  if(days.length){
    let run=0;
    for(let d=days[0];d<=t;d=add(d,1)){
      if(dow(d)===6)continue;
      if(sess(d)){run++;best=Math.max(best,run)}else if(d<t){run=0;rest++}
    }
    cur=run;
  }
  const wk=monday(t);let w=0,m=0;
  days.forEach(d=>{if(d>=wk&&d<=add(wk,6))w++;if(monthOf(d)===monthOf(t))m++});
  const last=days.length?days[days.length-1]:null;
  return{total:days.length,cur,best,rest,w,m,since:last?diff(t,last):null};
}
function muscleHits(){
  const t=T(),from=U.gview===0?"0000":add(t,-27),hits={},last={};
  MUSCLES.forEach(m=>{hits[m[0]]=0;last[m[0]]=null});
  Object.keys(S.gym.days).forEach(d=>{
    const x=S.gym.days[d];if(!x||x.t==="rest")return;
    (x.m||[]).forEach(id=>{if(d>=from&&d<=t)hits[id]++;if(!last[id]||d>last[id])last[id]=d});
  });
  return{hits,last};
}
function weekSets(start){
  const s={};MUSCLES.forEach(m=>s[m[0]]=0);
  S.lifts.forEach(l=>{if(l.d>=start&&l.d<=add(start,6)){const m=EXM[l.ex];if(m)s[m]+=l.sets}});
  return s;
}
const e1=(kg,reps)=>kg*(1+reps/30);

/* ---------- chart helpers ---------- */
function line(pts,unit,h){
  h=h||150;const w=420,L=40,R=26,Tp=16,B=24;
  if(!pts.length)return '<div class="empty">No entries yet.</div>';
  const ys=pts.map(p=>p.y);let lo=Math.min.apply(null,ys),hi=Math.max.apply(null,ys);
  if(hi-lo<1){lo-=1;hi+=1}const pd=(hi-lo)*.15;lo-=pd;hi+=pd;
  const t0=pts[0].t,t1=pts[pts.length-1].t,span=Math.max(1,t1-t0);
  const X=p=>pts.length===1?L+(w-L-R)/2:L+(p.t-t0)/span*(w-L-R);
  const Y=v=>Tp+(1-(v-lo)/(hi-lo))*(h-Tp-B);
  const path=pts.map((p,i)=>(i?"L":"M")+X(p).toFixed(1)+" "+Y(p.y).toFixed(1)).join(" ");
  const last=pts[pts.length-1];
  let g='';
  [lo+pd,(lo+hi)/2,hi-pd].forEach(v=>{g+='<line x1="'+L+'" x2="'+(w-R)+'" y1="'+Y(v)+'" y2="'+Y(v)+'" stroke="var(--line)"/><text x="'+(L-6)+'" y="'+(Y(v)+4)+'" text-anchor="end">'+r1(v)+'</text>'});
  const dots=pts.map(p=>'<circle cx="'+X(p).toFixed(1)+'" cy="'+Y(p.y).toFixed(1)+'" r="4" fill="var(--ac)" stroke="var(--surface)" stroke-width="2"><title>'+esc(p.l)+": "+r1(p.y)+" "+unit+'</title></circle>').join("");
  return '<svg viewBox="0 0 '+w+' '+h+'" width="100%" role="img" aria-label="Trend, latest '+r1(last.y)+' '+unit+'">'+g+

function studyCalc(){
  const t=T(),totalW=MODS.reduce((s,m)=>s+m[3],0),weeks=diff(EXAM,START)/7,budget=S.goal*weeks;
  const frac=Math.min(1,Math.max(0,diff(t,START)/diff(EXAM,START))),left=Math.max(.5,diff(EXAM,t)/7);
  const done={};MODS.forEach(m=>done[m[0]]=0);S.study.forEach(l=>done[l.m]=(done[l.m]||0)+l.h);
  const total=Object.values(done).reduce((s,n)=>s+n,0);
  const rows=MODS.map(m=>{const target=budget*m[3]/totalW,exp=target*frac,d=done[m[0]];
    let p="ok";if(exp>=1.5){const r=d/exp;p=r<.6?"hi":r<.9?"mid":"ok"}else p="none";
    return{id:m[0],name:m[1],sh:m[2],w:m[3],done:d,target:target,exp:exp,need:Math.max(0,target-d)/left,p:p,share:total?d/total:0}});
  return{rows:rows,total:total,weeks:weeks,budget:budget};
}

   '<div class="amount" style="margin-top:16px">'+r1(tot)+' <small>hours</small></div><div class="row">'+[.5,1,2,3].map(n=>'<button class="chip" data-a="hrs" data-n="'+n+'" style="min-width:64px;justify-content:center">+'+n+' h</button>').join("")+'<button class="chip" data-a="hrsundo" aria-label="Undo last" style="min-width:64px;justify-content:center">⌫</button></div>'+
   '<div style="margin-top:16px"><button class="btn" data-a="addstudy"'+(tot?"":" disabled style=\"opacity:.45\"")+'>Add to '+esc(MOD[U.sm][2])+'</button></div>'+
   '<div class="list" style="margin-top:14px">'+(S.study.filter(l=>l.d===U.sd).length?S.study.filter(l=>l.d===U.sd).map(l=>'<div class="li"><div>'+esc(MOD[l.m][2])+'</div><span class="amt">'+r1(l.h)+' h</span><button class="x" data-a="gdel" data-k="study" data-id="'+l.id+'" aria-label="Delete">×</button></div>').join(""):'<div class="empty">Nothing logged for this day.</div>')+'</div></section>';
  const mx=Math.max(1,...c.rows.map(r=>Math.max(r.done,r.exp)));
  h+='<section class="card"><h2>Where your hours go</h2><div class="sub">Black tick = hours you should have by today. Bar = hours you have.</div><div class="bars">'+
   c.rows.slice().sort((a,b)=>b.done-a.done).map(r=>'<div class="br"><div class="l">'+esc(r.name)+'<div class="hint" style="margin:0">'+Math.round(r.share*100)+'% of your study · '+r.w+' course h</div></div><div class="track"><div class="fill" style="width:'+r.done/mx*100+'%"></div><div class="mark" style="left:'+Math.min(99,r.exp/mx*100)+'%"></div></div><div class="v">'+r1(r.done)+'</div></div>').join("")+'</div></section>';
  h+='<section class="card"><h2>Priority</h2><div class="sub">High means under 60% of the hours expected by today. Targets split your '+S.goal+' h weekly goal across modules by course hours.</div><div class="list">'+
   c.rows.slice().sort((a,b)=>({hi:0,mid:1,ok:2,none:3}[a.p]-{hi:0,mid:1,ok:2,none:3}[b.p])).map(r=>'<div class="li" style="grid-template-columns:1fr auto"><div>'+esc(r.name)+'<div class="m">needs about '+r1(r.need)+' h a week · target '+Math.round(r.target)+' h</div></div><span class="pill '+r.p+'">'+({hi:"High",mid:"Medium",ok:"On track",none:"Too early"}[r.p])+'</span></div>').join("")+'</div>'+
   '<div style="margin-top:14px" class="glabel">Weekly goal</div>'+stepper("goal",S.goal,"hours a week",[-1,1])+'</section>';
  const wks=[];for(let i=0;i<16;i++){const s=add(START,i*7);wks.push({s:s,v:S.study.filter(l=>l.d>=s&&l.d<=add(s,6)).reduce((a,l)=>a+l.h,0)})}
  const wmx=Math.max(S.goal+2,...wks.map(w=>w.v));
  h+='<section class="card full"><h2>Hours per week</h2><div class="cols" style="height:140px"><div class="tline" style="bottom:'+S.goal/wmx*100+'%"></div>'+wks.map((w,i)=>'<div class="col" title="Week of '+short(w.s)+": "+r1(w.v)+' h"><i style="height:'+w.v/wmx*100+'%"></i><span>'+(i+1)+'</span></div>').join("")+'</div><div class="axis"></div><div class="hint">Dashed line is your weekly goal. Weeks run Mon–Sun from 5 Oct. Revision is week 16, exams the week after.</div></section>';
  return h;
}

/* ---------- render ---------- */
function render(){
  document.body.dataset.tab=U.tab;
  const tabs=[["gym","Gym"],["money","Money"],["study","Study"]];
  document.getElementById("tabs").innerHTML=tabs.map(a=>'<button role="tab" data-a="tab" data-t="'+a[0]+'" aria-selected="'+(U.tab===a[0])+'">'+a[1]+'</button>').join("");
  const v=U.tab==="gym"?viewGym():U.tab==="money"?viewMoney():viewStudy();
  document.getElementById("app").innerHTML='<div class="grid">'+v+'</div>';
  document.getElementById("foot").innerHTML='<button class="btn ghost sm" data-a="export">Export to Excel</button>'+(S.gym.days&&examples()?'<button class="btn ghost sm" data-a="unexample">Remove example data</button>':"");
}
const examples=()=>Object.values(S.gym.days).some(d=>d.ex)||S.lifts.some(x=>x.e)||S.tx.some(x=>x.ex)||S.study.some(x=>x.ex)||S.body.some(x=>x.ex);

/* ---------- actions ---------- */
function toast(msg,undo){
  const el=document.getElementById("toast");
  el.innerHTML='<div class="toast"><span>'+esc(msg)+'</span>'+(undo?'<button data-a="undo">Undo</button>':"")+'</div>';
  clearTimeout(toast.t);toast.t=setTimeout(()=>{el.innerHTML="";toast.undo=null},5000);toast.undo=undo||null;
}
function example(){
  const t=T();let n=0;
  for(let o=-10;o<=-1;o++){
    const d=add(t,o);if(dow(d)===6||o===-6)continue;
    const ty=["d1","d2","legs"][n%3];n++;
    S.gym.days[d]={t:ty,m:TPL[ty].slice(),ex:1};
    (ty==="d1"?[["Bench press",60+n*.8],["Incline DB press",22],["Lateral raise",8],["Biceps curl",12]]:
     ty==="d2"?[["Lat pulldown",55+n],["Barbell row",50],["Rear delt fly",8],["Triceps pushdown",25]]:
     [["Squat",70+n],["Romanian deadlift",60],["Leg curl",35],["Calf raise",50]]).forEach(e=>S.lifts.push({id:uid(),d:d,ex:e[0],sets:e[0]==="Bench press"||e[0]==="Squat"?4:3,reps:e[0]==="Calf raise"?15:10,kg:Math.round(e[1]*2)/2,e:1}));
  }
  [[-9,"Food",125,0],[-8,"Going out",18,1],[-8,"Transport",6,0],[-7,"Gym & supplements",300,0],[-6,"Phone & internet",100,0],[-5,"Food",35,0],[-4,"Gym & supplements",25,1],[-3,"Clothes",350,1],[-2,"Family",150,0],[-1,"Food",88,0]].forEach(a=>S.tx.push({id:uid(),k:"e",d:add(t,a[0]),c:a[1],a:a[2],i:a[3],ex:1}));
  S.tx.push({id:uid(),k:"i",d:monthOf(t)+"-01",c:"Income",a:2000,i:0,ex:1});
  [[-9,"bda",2],[-8,"fin",1.5],[-7,"mkt",1],[-7,"ob",1.5],[-5,"bda",2],[-4,"fin",1.5],[-3,"sm",1],[-2,"ob",2],[-1,"mkt",1]].forEach(a=>S.study.push({id:uid(),d:add(t,a[0]),m:a[1],h:a[2],ex:1}));
  S.body.push({id:uid(),d:add(t,-9),kg:72,ex:1},{id:uid(),d:add(t,-2),kg:72.3,ex:1});
  commit();
}
function unexample(){
  Object.keys(S.gym.days).forEach(d=>{if(S.gym.days[d].ex)delete S.gym.days[d]});
  S.lifts=S.lifts.filter(x=>!x.e);S.tx=S.tx.filter(x=>!x.ex);S.study=S.study.filter(x=>!x.ex);S.body=S.body.filter(x=>!x.ex);
  commit();
}
function lastFor(ex){const l=S.lifts.filter(x=>x.ex===ex).sort((a,b)=>a.d<b.d?-1:1).pop();if(l){U.sets=l.sets;U.reps=l.reps;U.kg=l.kg}else{U.sets=3;U.reps=8;U.kg=20}}
async function exportXlsx(){
  if(!window.XLSX){toast("Excel export did not load. Try again in a moment.");return}
  const X=window.XLSX,wb=X.utils.book_new();
  const g=Object.keys(S.gym.days).sort().map(d=>{const x=S.gym.days[d],r={Date:d,Day:TL[x.t]||""};MUSCLES.forEach(m=>r[m[1]]=(x.m||[]).includes(m[0])?"✔":"");return r});
  const sheets=[["Gym",g],["Lifts",S.lifts.slice().sort((a,b)=>a.d<b.d?-1:1).map(l=>({Date:l.d,Exercise:l.ex,Sets:l.sets,Reps:l.reps,"Weight kg":l.kg,"Est 1RM kg":r1(e1(l.kg,l.reps))}))],
   ["Bodyweight",S.body.slice().sort((a,b)=>a.d<b.d?-1:1).map(b=>({Date:b.d,"Weight kg":b.kg}))],
   ["Money",S.tx.slice().sort((a,b)=>a.d<b.d?-1:1).map(x=>({Date:x.d,Type:x.k==="i"?"Income":"Expense",Category:x.k==="i"?"":x.c,"Amount MAD":x.a,Impulse:x.i?"✔":""}))],
   ["Study",S.study.slice().sort((a,b)=>a.d<b.d?-1:1).map(l=>({Date:l.d,Module:MOD[l.m][1],Hours:l.h}))]];
  sheets.forEach(s=>X.utils.book_append_sheet(wb,X.utils.json_to_sheet(s[1].length?s[1]:[{}]),s[0]));
  const buf=X.write(wb,{type:"array",bookType:"xlsx"});
  try{const dl=window.claude&&window.claude.use?await window.claude.use("downloads"):null;
    if(!dl){toast("Saving files is not available in this view.");return}
    await dl.save({filename:"gym-money-study.xlsx",data:buf});toast("Exported.");
  }catch(e){if(!e||e.code!=="declined")toast("Could not export.")}
}
const A={
  tab:d=>{U.tab=d.t;try{localStorage.setItem("gms-tab",U.tab)}catch(e){}render()},
  gd:d=>{U.gd=add(U.gd,+d.n);render()},gtoday:()=>{U.gd=T();render()},gpick:d=>{U.gd=d.d;render();window.scrollTo({top:document.querySelector(".card").offsetTop-70,behavior:"smooth"})},
  gtype:d=>{const x=S.gym.days[U.gd];if(x&&x.t===d.t){delete S.gym.days[U.gd]}else S.gym.days[U.gd]={t:d.t,m:TPL[d.t].slice()};commit()},
  gmus:(d,el)=>{const x=S.gym.days[U.gd];if(!x)return;const s=new Set(x.m||[]);el.checked?s.add(d.m):s.delete(d.m);x.m=MUSCLES.map(m=>m[0]).filter(i=>s.has(i));commit()},
  gclear:()=>{delete S.gym.days[U.gd];commit()},
  gview:d=>{U.gview=+d.n;render()},
  gex:d=>{U.ex=d.e;lastFor(U.ex);render()},
  gsets:d=>{U.sets=Math.max(1,U.sets+ +d.n);render()},greps:d=>{U.reps=Math.max(1,U.reps+ +d.n);render()},gkg:d=>{U.kg=Math.max(0,U.kg+ +d.n);render()},
  glift:()=>{S.lifts.push({id:uid(),d:U.gd,ex:U.ex,sets:U.sets,reps:U.reps,kg:U.kg});commit();toast("Logged "+U.ex)},
  gbw:d=>{U.bw=Math.max(30,Math.round((U.bw+ +d.n)*10)/10);render()},
  gbwlog:()=>{S.body=S.body.filter(b=>b.d!==U.gd);S.body.push({id:uid(),d:U.gd,kg:U.bw});commit();toast("Weight logged")},
  gdel:d=>{const k=d.k,i=S[k].findIndex(x=>x.id===d.id);if(i<0)return;const it=S[k].splice(i,1)[0];commit();toast("Deleted",()=>{S[k].push(it);commit()})},
  mm:d=>{U.mm=addMonth(U.mm,+d.n);render()},md:d=>{U.md=add(U.md,+d.n);render()},
  kind:d=>{U.kind=d.k;render()},amt:d=>{U.amt.push(+d.n);render()},amtundo:()=>{U.amt.pop();render()},cat:d=>{U.cat=d.c;render()},
  imp:(d,el)=>{U.imp=el.checked;render()},
  addtx:()=>{const a=U.amt.reduce((s,n)=>s+n,0);if(!a)return;S.tx.push({id:uid(),k:U.kind,d:U.md,c:U.kind==="i"?"Income":U.cat,a:a,i:U.kind==="e"&&U.imp?1:0});U.amt=[];U.imp=false;U.mm=monthOf(U.md);commit();toast("Added "+nf(a)+" MAD")},
  bud:d=>{S.budgets[d.c]=Math.max(0,(S.budgets[d.c]||0)+ +d.n);commit()},
  sd:d=>{U.sd=add(U.sd,+d.n);render()},smod:d=>{U.sm=d.m;render()},hrs:d=>{U.hrs.push(+d.n);render()},hrsundo:()=>{U.hrs.pop();render()},
  addstudy:()=>{const h=U.hrs.reduce((s,n)=>s+n,0);if(!h)return;S.study.push({id:uid(),d:U.sd,m:U.sm,h:h});U.hrs=[];commit();toast("Added "+r1(h)+" h")},
  goal:d=>{S.goal=Math.max(1,S.goal+ +d.n);commit()},
  example:example,unexample:unexample,export:exportXlsx,
  undo:()=>{if(toast.undo){toast.undo();document.getElementById("toast").innerHTML=""}}
};
document.addEventListener("click",e=>{const b=e.target.closest("button[data-a]");if(!b)return;const f=A[b.dataset.a];if(f)f(b.dataset,b)});
document.addEventListener("change",e=>{const i=e.target.closest("input[data-a]");if(!i)return;const f=A[i.dataset.a];if(f)f(i.dataset,i)});

/* ---------- boot ---------- */
loadLocal();render();sync(hasData()?"Saved on this device":"");
initDb();
})();
</script>

</body></html>
